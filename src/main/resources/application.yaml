spring:
  application:
    name: eportal
  mongodb:
    uri: ${MONGODB_URI}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB


management:
  health:
    mongodb:
      enabled: false

jwt:
  duration: ${JWT_DURATION}
  signing:
    key: ${JWT_SIGNING_KEY}
logging:
  level:
    com:
     school:
      eportal: trace

paystack:
  secret:
    key: ${PAYSTACK_SECRET_KEY}
  redirect:
    url: ${PAYSTACK_REDIRECT_URL}